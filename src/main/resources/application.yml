spring:
  application:
    name: policygate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/policygate}
    username: ${SPRING_DATASOURCE_USERNAME:policygate}
    password: ${SPRING_DATASOURCE_PASSWORD:policygate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
