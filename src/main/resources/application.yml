spring:
  application:
    name: policygate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/policygate}
    username: ${SPRING_DATASOURCE_USERNAME:policygate}
    password: ${SPRING_DATASOURCE_PASSWORD:policygate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

policygate:
  cache:
    ttl: ${POLICYGATE_CACHE_TTL:10m}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: always
