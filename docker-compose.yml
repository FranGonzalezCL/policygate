services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: policygate
      POSTGRES_USER: policygate
      POSTGRES_PASSWORD: policygate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policygate -d policygate"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    image: policygate:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/policygate
      SPRING_DATASOURCE_USERNAME: policygate
      SPRING_DATASOURCE_PASSWORD: policygate
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
